name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: gradle -p android assembleDebug -Pvcode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SuperAuz.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SuperAuz.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}" \
            --target ${{ github.sha }}
